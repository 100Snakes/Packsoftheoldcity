<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City of Shadows — Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a14;
      --surface: #12121f;
      --card: #1a1a2e;
      --border: #2a2a4a;
      --accent: #f5a623;
      --accent2: #e8453c;
      --accent3: #4fc3f7;
      --text: #f0f0ff;
      --muted: #888aaa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar-nav { display: flex; gap: 16px; }
    .nav-btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn.coming { opacity: 0.4; cursor: not-allowed; }
    .badge {
      display: inline-block;
      background: rgba(79,195,247,0.12);
      color: var(--accent3);
      border: 1px solid rgba(79,195,247,0.25);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-left: 4px;
    }

    /* Map area */
    .map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas#map { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas#map:active { cursor: grabbing; }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--text);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
      z-index: 20;
      font-weight: 700;
    }
    .tooltip .tip-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 2px;
    }
    .tooltip.show { opacity: 1; }

    /* Minimap */
    .minimap {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      z-index: 10;
    }
    canvas#mini { display: block; border-radius: 4px; }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      z-index: 10;
      font-size: 12px;
      color: var(--muted);
    }
    .legend-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-sq { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* Coords */
    .coords {
      position: absolute;
      top: 12px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-logo">🌆 City of Shadows</div>
    <div class="topbar-nav">
      <button class="nav-btn" onclick="location.href='index.html'">🏠 Home</button>
      <button class="nav-btn coming">⚔️ Levels <span class="badge">Soon</span></button>
      <button class="nav-btn coming">🎁 Packs <span class="badge">Soon</span></button>
      <button class="nav-btn coming">🔫 PVP <span class="badge">Soon</span></button>
    </div>
  </div>

  <!-- Map -->
  <div class="map-container" id="map-container">
    <canvas id="map"></canvas>
    <canvas id="mini" width="120" height="80"></canvas>
    <div class="tooltip" id="tip">
      <div id="tip-name"></div>
      <div class="tip-sub" id="tip-sub"></div>
    </div>
    <div class="legend">
      <div class="legend-title">Map Key</div>
      <div class="legend-item"><div class="legend-sq" style="background:#4a5568;border:1px dashed #888;"></div>Ruins</div>
      <div class="legend-item"><div class="legend-sq" style="background:#3a4a5a;"></div>Buildings</div>
      <div class="legend-item"><div class="legend-sq" style="background:#6b5a3a;border:1px solid #c6a84b;"></div>Landmark</div>
      <div class="legend-item"><div class="legend-sq" style="background:#2a4a6a;border:1px solid #5a9fd4;"></div>Water / docks</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e53e3e;"></div>Helicopter pad</div>
    </div>
    <div class="coords" id="coords">x: 0  y: 0</div>
  </div>

  <script>
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const mini = document.getElementById('mini');
    const mctx = mini.getContext('2d');
    const tip = document.getElementById('tip');
    const container = document.getElementById('map-container');

    const MAP_W = 1360, MAP_H = 960;
    let offsetX = 0, offsetY = 0, scale = 1;
    let dragging = false, lastX, lastY;

    function resize() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      drawMap();
    }

    const buildings = [
      {x:80,y:80,w:180,h:140,label:'Old Mall',sub:'Helicopter pad here',color:'#6b5a3a',type:'landmark'},
      {x:300,y:80,w:120,h:100,label:'Ruins Block A',sub:'Abandoned sector',color:'#4a5568',type:'ruin'},
      {x:440,y:60,w:160,h:120,label:'Collapsed Tower',sub:'Unstable — enter with care',color:'#4a5568',type:'ruin'},
      {x:640,y:40,w:200,h:160,label:'City Hall',sub:'Ruined government building',color:'#6b5a3a',type:'landmark'},
      {x:880,y:60,w:140,h:110,label:'Ruins Block B',sub:'Abandoned sector',color:'#4a5568',type:'ruin'},
      {x:1060,y:50,w:200,h:130,label:'Old Factory',sub:'Industrial ruins',color:'#555',type:'ruin'},

      {x:80,y:340,w:160,h:120,label:'Slum District',sub:'Few survivors here',color:'#4a5568',type:'building'},
      {x:280,y:320,w:140,h:140,label:'Abandoned Market',sub:'Loot possible',color:'#4a5568',type:'ruin'},
      {x:460,y:310,w:180,h:130,label:'Police HQ',sub:'Empty precinct',color:'#5a6a7a',type:'building'},
      {x:680,y:300,w:160,h:150,label:'Shadow Hotel',sub:'NPC shelter',color:'#3a4a5a',type:'building'},
      {x:880,y:310,w:150,h:130,label:'Warehouse Row',sub:'Pack loot zone',color:'#4a5568',type:'building'},
      {x:1070,y:300,w:190,h:140,label:'Dark Tower',sub:'Main landmark',color:'#2d3a4a',type:'landmark'},

      {x:80,y:600,w:220,h:130,label:'Docks East',sub:'Water access point',color:'#2a4a6a',type:'water'},
      {x:340,y:590,w:150,h:140,label:'Shipyard Ruins',sub:'Old cargo area',color:'#4a5568',type:'ruin'},
      {x:530,y:580,w:180,h:150,label:'Underground Lab',sub:'Secret location',color:'#3a3a5a',type:'building'},
      {x:750,y:570,w:170,h:160,label:'Black Market',sub:'Trade & packs',color:'#4a3a2a',type:'building'},
      {x:960,y:580,w:160,h:140,label:'Sewer Entrance',sub:'Goes underground',color:'#555',type:'building'},
      {x:1160,y:570,w:140,h:150,label:'Docks West',sub:'Water access point',color:'#2a4a6a',type:'water'},

      {x:80,y:840,w:260,h:80,label:'South Gate',sub:'City exit / entry',color:'#6b5a3a',type:'landmark'},
      {x:580,y:830,w:200,h:90,label:'Escape Route',sub:'Emergency path',color:'#4a5568',type:'ruin'},
      {x:1000,y:830,w:280,h:90,label:'Train Yard',sub:'Decommissioned',color:'#4a5568',type:'ruin'},
    ];

    const helipads = [
      {x:170,y:150,label:'Helipad',sub:'Old Mall rooftop'},
    ];

    const roads = [
      {x1:0,y1:280,x2:MAP_W,y2:280},
      {x1:0,y1:540,x2:MAP_W,y2:540},
      {x1:0,y1:800,x2:MAP_W,y2:800},
      {x1:260,y1:0,x2:260,y2:MAP_H},
      {x1:620,y1:0,x2:620,y2:MAP_H},
      {x1:1040,y1:0,x2:1040,y2:MAP_H},
    ];

    function drawMap() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#0e1018';
      ctx.fillRect(0, 0, MAP_W, MAP_H);

      ctx.strokeStyle = '#1e2530';
      ctx.lineWidth = 36;
      roads.forEach(r => {
        ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke();
      });
      ctx.strokeStyle = '#2a3545';
      ctx.lineWidth = 1;
      ctx.setLineDash([16,16]);
      roads.forEach(r => {
        ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke();
      });
      ctx.setLineDash([]);

      ctx.strokeStyle = '#1a3a5a';
      ctx.lineWidth = 44;
      ctx.beginPath();
      ctx.moveTo(0,760); ctx.bezierCurveTo(340,750,680,770,1360,755);
      ctx.stroke();

      buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();

        if (b.type === 'ruin') {
          ctx.strokeStyle = 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1;
          ctx.setLineDash([5,5]);
          ctx.beginPath(); ctx.moveTo(b.x+12,b.y+12); ctx.lineTo(b.x+b.w-12,b.y+b.h-12); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(b.x+b.w-12,b.y+12); ctx.lineTo(b.x+12,b.y+b.h-12); ctx.stroke();
          ctx.setLineDash([]);
        }
        if (b.type === 'landmark') {
          ctx.strokeStyle = '#c6a84b';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);
        }
        if (b.type === 'water') {
          ctx.strokeStyle = '#5a9fd4';
          ctx.lineWidth = 2;
          ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);
        }

        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = `bold ${Math.max(10,14)}px Nunito, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 5);
      });

      helipads.forEach(h => {
        ctx.fillStyle = '#e53e3e';
        ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('H', h.x, h.y+5);

        ctx.strokeStyle = 'rgba(229,62,62,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.arc(h.x, h.y, 28, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
      });

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.font = '11px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('CITY OF SHADOWS — map v0.1', 10, MAP_H - 10);

      ctx.restore();
      drawMini();
    }

    function drawMini() {
      mctx.fillStyle = '#0e1018';
      mctx.fillRect(0,0,120,80);
      const sx = 120/MAP_W, sy = 80/MAP_H;
      buildings.forEach(b => {
        mctx.fillStyle = b.color;
        mctx.fillRect(b.x*sx, b.y*sy, b.w*sx, b.h*sy);
      });
      helipads.forEach(h => {
        mctx.fillStyle = '#e53e3e';
        mctx.beginPath(); mctx.arc(h.x*sx, h.y*sy, 3, 0, Math.PI*2); mctx.fill();
      });
      const vx = -offsetX/scale*sx, vy = -offsetY/scale*sy;
      const vw = canvas.width/scale*sx, vh = canvas.height/scale*sy;
      mctx.strokeStyle = '#f5a623';
      mctx.lineWidth = 1;
      mctx.strokeRect(vx, vy, vw, vh);
    }

    canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
    window.addEventListener('mouseup', () => dragging=false);
    window.addEventListener('mousemove', e => {
      if (dragging) {
        offsetX += e.clientX - lastX;
        offsetY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        clamp(); drawMap();
      }
      const r = canvas.getBoundingClientRect();
      const mx = (e.clientX - r.left - offsetX) / scale;
      const my = (e.clientY - r.top - offsetY) / scale;
      document.getElementById('coords').textContent = `x: ${Math.round(mx)}  y: ${Math.round(my)}`;
      checkHover(e.clientX - r.left, e.clientY - r.top, mx, my);
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      offsetX = mx - (mx - offsetX) * factor;
      offsetY = my - (my - offsetY) * factor;
      scale *= factor;
      scale = Math.max(0.3, Math.min(3, scale));
      clamp(); drawMap();
    }, {passive:false});

    function clamp() {
      offsetX = Math.min(0, Math.max(offsetX, canvas.width - MAP_W * scale));
      offsetY = Math.min(0, Math.max(offsetY, canvas.height - MAP_H * scale));
    }

    function checkHover(sx, sy, mx, my) {
      for (const h of helipads) {
        const dx = mx-h.x, dy = my-h.y;
        if (Math.sqrt(dx*dx+dy*dy) < 20) {
          showTip(sx, sy, h.label, h.sub); return;
        }
      }
      for (const b of buildings) {
        if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) {
          showTip(sx, sy, b.label, b.sub); return;
        }
      }
      tip.classList.remove('show');
      canvas.style.cursor = dragging ? 'grabbing' : 'grab';
    }

    function showTip(sx, sy, name, sub) {
      document.getElementById('tip-name').textContent = name;
      document.getElementById('tip-sub').textContent = sub;
      tip.style.left = (sx+16)+'px';
      tip.style.top = (sy-10)+'px';
      tip.classList.add('show');
      canvas.style.cursor = 'pointer';
    }

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
