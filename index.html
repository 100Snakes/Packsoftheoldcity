<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>City of Shadows — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a14;
      --surface: #12121f;
      --card: #1a1a2e;
      --border: #2a2a4a;
      --accent: #f5a623;
      --accent2: #e8453c;
      --accent3: #4fc3f7;
      --text: #f0f0ff;
      --muted: #888aaa;
      --success: #4caf50;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: orb-drift 10s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .bg-orb-1 { width: 500px; height: 500px; background: #f5a623; top: -150px; left: -150px; animation-delay: 0s; }
    .bg-orb-2 { width: 400px; height: 400px; background: #e8453c; bottom: -120px; right: -120px; animation-delay: 3s; }
    .bg-orb-3 { width: 300px; height: 300px; background: #4fc3f7; bottom: 100px; left: 50px; animation-delay: 6s; }

    @keyframes orb-drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.1); }
    }

    /* Floating packs in bg */
    .pack-float {
      position: fixed;
      font-size: 2rem;
      opacity: 0.08;
      animation: float-up linear infinite;
      pointer-events: none;
    }
    @keyframes float-up {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.08; }
      90% { opacity: 0.08; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Main card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 30px;
      width: 100%;
      max-width: 360px;
      position: relative;
      z-index: 10;
      box-shadow: 0 0 60px rgba(245,166,35,0.08), 0 30px 80px rgba(0,0,0,0.5);
      animation: card-in 0.6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 18px;
    }
    .logo-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 4px;
      animation: pulse-icon 2s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .logo-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 15px rgba(245,166,35,0.3);
    }

    /* Forms */
    .form { display: none; flex-direction: column; gap: 10px; }
    .form.active { display: flex; animation: form-in 0.3s ease both; }
    @keyframes form-in {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .field input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 9px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.12);
    }
    .field input::placeholder { color: var(--muted); font-weight: 400; }

    /* Submit button */
    .btn-submit {
      margin-top: 4px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 6px 20px rgba(245,166,35,0.25);
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245,166,35,0.35); }
    .btn-submit:active { transform: translateY(0); }

    /* Ripple */
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0); animation: ripple 0.5s linear;
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }

    /* Message */
    .msg {
      text-align: center;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      font-weight: 700;
    }
    .msg.success { background: rgba(76,175,80,0.15); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); display: block; }
    .msg.error   { background: rgba(232,69,60,0.15);  color: #e8453c;  border: 1px solid rgba(232,69,60,0.3);  display: block; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: 0.75rem; margin: 4px 0;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Social */
    .btn-social {
      padding: 11px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-social:hover { border-color: var(--accent3); background: rgba(79,195,247,0.06); }

    .forgot {
      text-align: right; font-size: 0.8rem; color: var(--accent3);
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    }

    /* Coming Soon badge */
    .coming-soon-note {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      background: rgba(79,195,247,0.12);
      color: var(--accent3);
      border: 1px solid rgba(79,195,247,0.25);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Floating pack emojis -->
  <div class="pack-float" style="left:8%;animation-duration:12s;animation-delay:0s;font-size:2.5rem;">🌆</div>
  <div class="pack-float" style="left:22%;animation-duration:17s;animation-delay:4s;">🌑</div>
  <div class="pack-float" style="left:55%;animation-duration:14s;animation-delay:2s;font-size:1.8rem;">🗡️</div>
  <div class="pack-float" style="left:75%;animation-duration:19s;animation-delay:7s;">🌫️</div>
  <div class="pack-float" style="left:88%;animation-duration:11s;animation-delay:1s;font-size:2.2rem;">🐦‍⬛</div>
  <div class="pack-float" style="left:40%;animation-duration:15s;animation-delay:9s;font-size:1.5rem;">💀</div>

  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <span class="logo-icon">🌆</span>
      <div class="logo-title">City of Shadows</div>
      <div class="logo-sub">Explore · Battle · Collect</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Message -->
    <div class="msg" id="msg"></div>

    <!-- LOGIN FORM -->
    <div class="form active" id="form-login">
      <div class="field">
        <label>Username or Email</label>
        <input type="text" id="login-user" placeholder="Enter your username..." />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <div class="forgot">Forgot password?</div>
      <button class="btn-submit" onclick="handleLogin(event)">ENTER THE SHADOWS</button>
      <div class="divider">or continue with</div>
      <button class="btn-social">🎮 Continue with Google</button>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form" id="form-signup">
      <div class="field">
        <label>Username</label>
        <input type="text" id="signup-user" placeholder="Choose a cool name..." />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="your@email.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-pass" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="••••••••" />
      </div>
      <button class="btn-submit" onclick="handleSignup(event)">CREATE ACCOUNT</button>
      <div class="divider">or continue with</div>
      <button class="btn-social">🎮 Continue with Google</button>
    </div>

    <div class="coming-soon-note">
      PVP Mode & Special Character Levels <span class="badge">Coming Soon</span>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.getElementById('form-' + tab).classList.add('active');
      clearMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }
    function clearMsg() {
      const el = document.getElementById('msg');
      el.className = 'msg';
    }

    function rippleEffect(btn, e) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }

    async function handleLogin(e) {
      rippleEffect(e.currentTarget, e);
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      if (!user || !pass) return showMsg('⚠️ Please fill in all fields.', 'error');
      showMsg('⏳ Logging in...', 'success');
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('✅ ' + data.message, 'success');
          setTimeout(() => window.location.href = '/map', 1500);
        } else {
          showMsg('⚠️ ' + data.error, 'error');
        }
      } catch {
        showMsg('⚠️ Could not connect to server.', 'error');
      }
    }

    async function handleSignup(e) {
      rippleEffect(e.currentTarget, e);
      const user    = document.getElementById('signup-user').value.trim();
      const email   = document.getElementById('signup-email').value.trim();
      const pass    = document.getElementById('signup-pass').value;
      const confirm = document.getElementById('signup-confirm').value;
      if (!user || !email || !pass || !confirm) return showMsg('⚠️ Please fill in all fields.', 'error');
      if (pass !== confirm) return showMsg('⚠️ Passwords do not match!', 'error');
      if (pass.length < 6)  return showMsg('⚠️ Password must be at least 6 characters.', 'error');
      showMsg('⏳ Creating account...', 'success');
      try {
        const res = await fetch('/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, email, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('🎉 ' + data.message, 'success');
          setTimeout(() => window.location.href = '/map', 1500);
        } else {
          showMsg('⚠️ ' + data.error, 'error');
        }
      } catch {
        showMsg('⚠️ Could not connect to server.', 'error');
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const loginActive = document.getElementById('form-login').classList.contains('active');
      if (loginActive) document.querySelector('#form-login .btn-submit').click();
      else document.querySelector('#form-signup .btn-submit').click();
    });
  </script>
</body>
</html>
